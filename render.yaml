services:
  - type: web
    name: smesh-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smesh-db
          property: connectionString
      - key: PORT
        value: 3001

databases:
  - name: smesh-db
    databaseName: smesh
    plan: free
    region: singapore
